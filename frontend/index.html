<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brew & Co. — POS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    /* ── reset & tokens ─────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --espresso: #1a0f0a;
      --roast:    #3b1f12;
      --latte:    #c8956a;
      --cream:    #f5ede3;
      --foam:     #fdf8f3;
      --amber:    #e8a44a;
      --sage:     #7a9e7e;
      --blush:    #d4706a;
      --text:     #2c1810;
      --muted:    #8a7060;
      --border:   rgba(60,30,15,.12);
      --shadow-s: 0 2px 8px rgba(26,15,10,.10);
      --shadow-m: 0 8px 24px rgba(26,15,10,.14);
      --shadow-l: 0 20px 48px rgba(26,15,10,.18);
      --r:        12px;
      --r-lg:     20px;
    }

    html, body {
      height: 100%;
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--text);
      overflow: hidden;
    }

    /* ── layout ─────────────────────────────────────── */
    .app {
      display: grid;
      grid-template-columns: 220px 1fr 380px;
      grid-template-rows: 64px 1fr;
      height: 100vh;
    }

    /* ── topbar ─────────────────────────────────────── */
    .topbar {
      grid-column: 1 / -1;
      background: var(--espresso);
      display: flex;
      align-items: center;
      padding: 0 28px;
      gap: 24px;
      position: relative;
      z-index: 20;
    }

    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.35rem;
      color: var(--cream);
      letter-spacing: .02em;
      white-space: nowrap;
    }
    .logo span { color: var(--amber); }

    .topbar-tabs {
      display: flex;
      gap: 4px;
      margin-left: auto;
    }
    .tab-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-family: inherit;
      font-size: .85rem;
      font-weight: 500;
      padding: 7px 18px;
      border-radius: 8px;
      cursor: pointer;
      transition: background .18s, color .18s;
      letter-spacing: .03em;
    }
    .tab-btn:hover  { background: rgba(255,255,255,.07); color: var(--cream); }
    .tab-btn.active { background: var(--latte);          color: var(--espresso); }

    .topbar-info {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-left: 16px;
      font-size: .8rem;
      color: var(--muted);
    }
    .table-input {
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 8px;
      padding: 5px 10px;
      color: var(--cream);
      font-family: inherit;
      font-size: .82rem;
      width: 80px;
      text-align: center;
      outline: none;
    }
    .table-input::placeholder { color: var(--muted); }

    /* ── sidebar (category nav) ─────────────────────── */
    .sidebar {
      background: var(--roast);
      padding: 20px 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .sidebar-label {
      font-size: .65rem;
      font-weight: 600;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: rgba(200,149,106,.5);
      padding: 4px 20px 10px;
    }
    .cat-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      background: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-size: .88rem;
      font-weight: 400;
      color: rgba(245,237,227,.7);
      transition: background .15s, color .15s;
      text-align: left;
    }
    .cat-btn .icon { font-size: 1.1rem; }
    .cat-btn:hover  { background: rgba(245,237,227,.06); color: var(--cream); }
    .cat-btn.active { background: rgba(232,164,74,.15);  color: var(--amber);  font-weight: 500; }
    .cat-btn.active::before {
      content: '';
      position: absolute;
      left: 0;
      width: 3px;
      height: 32px;
      background: var(--amber);
      border-radius: 0 2px 2px 0;
    }
    .cat-btn { position: relative; }

    /* ── menu grid ───────────────────────────────────── */
    .menu-area {
      overflow-y: auto;
      padding: 24px;
      background: var(--foam);
    }

    .search-row {
      margin-bottom: 20px;
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .search-box {
      flex: 1;
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 10px 16px;
      font-family: inherit;
      font-size: .88rem;
      outline: none;
      transition: border-color .18s, box-shadow .18s;
    }
    .search-box:focus {
      border-color: var(--latte);
      box-shadow: 0 0 0 3px rgba(200,149,106,.15);
    }

    .cat-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.3rem;
      color: var(--roast);
      margin-bottom: 16px;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 14px;
    }

    .menu-card {
      background: white;
      border-radius: var(--r);
      padding: 16px;
      cursor: pointer;
      border: 1.5px solid transparent;
      transition: transform .18s, box-shadow .18s, border-color .18s;
      position: relative;
      overflow: hidden;
    }
    .menu-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(232,164,74,.04) 0%, transparent 60%);
    }
    .menu-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-m);
      border-color: var(--latte);
    }
    .menu-card.unavailable {
      opacity: .45;
      cursor: not-allowed;
    }
    .menu-card-name {
      font-weight: 600;
      font-size: .9rem;
      line-height: 1.3;
      color: var(--text);
      margin-bottom: 4px;
    }
    .menu-card-desc {
      font-size: .75rem;
      color: var(--muted);
      line-height: 1.4;
      margin-bottom: 10px;
      min-height: 32px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .menu-card-price {
      font-family: 'Playfair Display', serif;
      font-size: 1.05rem;
      color: var(--roast);
      font-weight: 700;
    }
    .add-dot {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 26px;
      height: 26px;
      background: var(--cream);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      color: var(--latte);
      transition: background .15s, color .15s;
    }
    .menu-card:hover .add-dot {
      background: var(--amber);
      color: white;
    }

    /* ── order panel ─────────────────────────────────── */
    .order-panel {
      background: white;
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .order-header {
      padding: 20px 22px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .order-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      color: var(--roast);
    }
    .order-badge {
      background: var(--amber);
      color: var(--espresso);
      font-size: .7rem;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 999px;
    }

    .order-items {
      flex: 1;
      overflow-y: auto;
      padding: 12px 22px;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 8px;
      color: var(--muted);
    }
    .empty-icon { font-size: 2.8rem; opacity: .4; }
    .empty-text { font-size: .85rem; }

    .order-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 4px 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      align-items: start;
      animation: slideIn .2s ease;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(12px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .oi-name { font-size: .88rem; font-weight: 500; grid-column: 1; }
    .oi-price {
      font-size: .88rem;
      font-weight: 600;
      color: var(--roast);
      grid-column: 2;
      text-align: right;
    }
    .oi-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      grid-column: 1;
    }
    .oi-controls button {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--cream);
      cursor: pointer;
      font-size: .9rem;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .15s;
    }
    .oi-controls button:hover { background: var(--latte); color: white; border-color: var(--latte); }
    .oi-qty { font-size: .82rem; font-weight: 600; min-width: 18px; text-align: center; }
    .oi-remove {
      grid-column: 2;
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: .8rem;
      padding: 2px;
      transition: color .15s;
    }
    .oi-remove:hover { color: var(--blush); }

    /* ── order totals ───────────────────────────────── */
    .order-footer {
      border-top: 1px solid var(--border);
      padding: 16px 22px;
    }

    .discount-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 14px;
    }
    .discount-row label { font-size: .78rem; color: var(--muted); white-space: nowrap; }
    .discount-input {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      font-family: inherit;
      font-size: .82rem;
      outline: none;
      text-align: right;
      transition: border-color .18s;
    }
    .discount-input:focus { border-color: var(--latte); }

    .totals { margin-bottom: 16px; }
    .totals-row {
      display: flex;
      justify-content: space-between;
      font-size: .82rem;
      color: var(--muted);
      padding: 3px 0;
    }
    .totals-row.total {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
      border-top: 1px solid var(--border);
      margin-top: 6px;
      padding-top: 8px;
    }

    .action-btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .btn {
      padding: 12px;
      border-radius: var(--r);
      font-family: inherit;
      font-size: .85rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all .18s;
      letter-spacing: .02em;
    }
    .btn-outline {
      background: var(--cream);
      color: var(--roast);
      border: 1.5px solid var(--border);
    }
    .btn-outline:hover { background: var(--border); }
    .btn-primary {
      background: var(--roast);
      color: var(--cream);
    }
    .btn-primary:hover { background: var(--espresso); }
    .btn-amber {
      background: var(--amber);
      color: var(--espresso);
      grid-column: 1 / -1;
    }
    .btn-amber:hover { filter: brightness(1.08); }
    .btn:disabled { opacity: .4; cursor: not-allowed; }

    /* ── views: reports & history ─────────────────────── */
    .view-area {
      grid-column: 2 / -1;
      overflow-y: auto;
      padding: 30px 36px;
      display: none;
    }
    .view-area.active { display: block; }

    .view-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.7rem;
      color: var(--roast);
      margin-bottom: 6px;
    }
    .view-sub { font-size: .85rem; color: var(--muted); margin-bottom: 28px; }

    .period-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 24px;
    }
    .period-btn {
      padding: 7px 18px;
      border-radius: 8px;
      border: 1.5px solid var(--border);
      background: white;
      font-family: inherit;
      font-size: .82rem;
      font-weight: 500;
      cursor: pointer;
      transition: all .15s;
    }
    .period-btn.active { background: var(--roast); color: var(--cream); border-color: var(--roast); }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 28px;
    }
    .stat-card {
      background: white;
      border-radius: var(--r);
      padding: 20px;
      border: 1px solid var(--border);
    }
    .stat-label { font-size: .72rem; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
    .stat-val {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      color: var(--roast);
      font-weight: 700;
    }
    .stat-sub { font-size: .72rem; color: var(--muted); margin-top: 4px; }

    .report-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }

    .report-card {
      background: white;
      border-radius: var(--r);
      padding: 22px;
      border: 1px solid var(--border);
    }
    .report-card-title {
      font-size: .78rem;
      font-weight: 600;
      letter-spacing: .07em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 16px;
    }

    .top-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
    }
    .top-item:last-child { border-bottom: none; }
    .top-item-rank {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--cream);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .7rem;
      font-weight: 700;
      color: var(--latte);
      flex-shrink: 0;
    }
    .top-item-name { flex: 1; font-size: .85rem; font-weight: 500; }
    .top-item-qty  { font-size: .8rem; color: var(--muted); }
    .top-item-rev  { font-size: .85rem; font-weight: 600; color: var(--roast); }

    /* mini bar chart */
    .bar-chart { display: flex; flex-direction: column; gap: 8px; }
    .bar-row { display: flex; align-items: center; gap: 10px; }
    .bar-label { font-size: .72rem; color: var(--muted); width: 44px; flex-shrink: 0; }
    .bar-track { flex: 1; height: 8px; background: var(--cream); border-radius: 4px; overflow: hidden; }
    .bar-fill  { height: 100%; background: var(--latte); border-radius: 4px; transition: width .5s ease; }
    .bar-val   { font-size: .72rem; font-weight: 600; color: var(--roast); width: 52px; text-align: right; flex-shrink: 0; }

    /* history table */
    .history-table {
      width: 100%;
      border-collapse: collapse;
      font-size: .84rem;
    }
    .history-table th {
      text-align: left;
      font-size: .7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--muted);
      padding: 0 14px 12px;
    }
    .history-table td {
      padding: 13px 14px;
      border-bottom: 1px solid var(--border);
    }
    .history-table tr:last-child td { border-bottom: none; }
    .history-table tr:hover td { background: var(--foam); }

    .status-pill {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: .7rem;
      font-weight: 600;
    }
    .status-paid       { background: #d4edda; color: #1e6b36; }
    .status-billed     { background: #fff3cd; color: #856404; }
    .status-open       { background: #cce5ff; color: #004085; }
    .status-cancelled  { background: #f8d7da; color: #721c24; }

    .pagination {
      display: flex;
      gap: 6px;
      align-items: center;
      justify-content: center;
      margin-top: 20px;
    }
    .page-btn {
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: white;
      font-family: inherit;
      font-size: .8rem;
      cursor: pointer;
      transition: all .15s;
    }
    .page-btn.active { background: var(--roast); color: var(--cream); border-color: var(--roast); }
    .page-btn:disabled { opacity: .35; cursor: not-allowed; }

    /* ── receipt modal ───────────────────────────────── */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(26,15,10,.55);
      backdrop-filter: blur(3px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity .22s;
    }
    .modal-backdrop.open { opacity: 1; pointer-events: all; }

    .receipt {
      background: white;
      border-radius: var(--r-lg);
      width: 360px;
      max-height: 88vh;
      overflow-y: auto;
      box-shadow: var(--shadow-l);
      transform: translateY(16px) scale(.97);
      transition: transform .22s;
    }
    .modal-backdrop.open .receipt { transform: none; }

    .receipt-header {
      background: var(--roast);
      border-radius: var(--r-lg) var(--r-lg) 0 0;
      padding: 22px;
      text-align: center;
    }
    .receipt-cafe { font-family: 'Playfair Display', serif; font-size: 1.4rem; color: var(--cream); }
    .receipt-addr { font-size: .75rem; color: rgba(245,237,227,.6); margin-top: 4px; }

    .receipt-body { padding: 20px 22px; }
    .receipt-meta { font-size: .78rem; color: var(--muted); margin-bottom: 14px; }
    .receipt-meta b { color: var(--text); }

    .receipt-items { margin-bottom: 14px; }
    .ri-row {
      display: flex;
      justify-content: space-between;
      padding: 5px 0;
      font-size: .82rem;
    }
    .ri-row.divider { border-top: 1px dashed var(--border); margin-top: 6px; padding-top: 10px; }
    .ri-row.total-row { font-weight: 700; font-size: .95rem; color: var(--roast); }

    .receipt-thanks {
      text-align: center;
      font-size: .78rem;
      color: var(--muted);
      border-top: 1px dashed var(--border);
      padding-top: 14px;
      font-style: italic;
    }

    .receipt-actions {
      display: flex;
      gap: 10px;
      padding: 16px 22px 22px;
    }

    /* ── toast ───────────────────────────────────────── */
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 200;
    }
    .toast {
      background: var(--espresso);
      color: var(--cream);
      padding: 10px 18px;
      border-radius: var(--r);
      font-size: .83rem;
      box-shadow: var(--shadow-m);
      animation: toastIn .25s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    @keyframes toastIn {
      from { opacity: 0; transform: translateX(20px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .toast.success { border-left: 4px solid var(--sage); }
    .toast.error   { border-left: 4px solid var(--blush); }

    /* ── loader ───────────────────────────────────────── */
    .loader {
      text-align: center;
      padding: 40px;
      color: var(--muted);
      font-size: .88rem;
    }

    /* ── scrollbar ───────────────────────────────────── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>

<!-- ════════════════════════════════════════════
     LAYOUT
════════════════════════════════════════════ -->
<div class="app">

  <!-- top bar -->
  <header class="topbar">
    <div class="logo">Brew <span>&amp;</span> Co.</div>

    <div class="topbar-tabs">
      <button class="tab-btn active" data-view="pos">☕  Order</button>
      <button class="tab-btn"        data-view="reports">📊  Reports</button>
      <button class="tab-btn"        data-view="history">🗃  History</button>
    </div>

    <div class="topbar-info">
      <span style="color:var(--muted);font-size:.75rem;">Table</span>
      <input class="table-input" id="tableInput" placeholder="T1" maxlength="4" />
    </div>
  </header>

  <!-- ── POS view ───────────────────────────── -->
  <nav class="sidebar" id="sidebar"></nav>

  <main class="menu-area" id="menuArea">
    <div class="search-row">
      <input class="search-box" id="searchBox" placeholder="Search menu items…" />
    </div>
    <div id="menuContent"><div class="loader">Loading menu…</div></div>
  </main>

  <aside class="order-panel">
    <div class="order-header">
      <span class="order-title">Current Order</span>
      <span class="order-badge" id="itemCount">0 items</span>
    </div>
    <div class="order-items" id="orderItems">
      <div class="empty-state">
        <div class="empty-icon">☕</div>
        <div class="empty-text">Tap an item to add it</div>
      </div>
    </div>
    <div class="order-footer">
      <div class="discount-row">
        <label>Discount (₹)</label>
        <input class="discount-input" id="discountInput" type="number" min="0" step="0.5" placeholder="0.00" />
      </div>
      <div class="totals" id="totalsBox"></div>
      <div class="action-btns">
        <button class="btn btn-outline" id="clearBtn">Clear</button>
        <button class="btn btn-primary" id="billBtn" disabled>Bill</button>
        <button class="btn btn-amber"   id="payBtn"  disabled>Place Order &amp; Pay</button>
      </div>
    </div>
  </aside>

  <!-- ── Reports view ───────────────────────── -->
  <section class="view-area" id="reportsView">
    <div class="view-title">Sales Reports</div>
    <div class="view-sub">Revenue, top items &amp; daily trends</div>
    <div class="period-tabs">
      <button class="period-btn active" data-period="today">Today</button>
      <button class="period-btn" data-period="week">Last 7 Days</button>
      <button class="period-btn" data-period="month">Last 30 Days</button>
    </div>
    <div id="reportsContent"><div class="loader">Loading…</div></div>
  </section>

  <!-- ── History view ───────────────────────── -->
  <section class="view-area" id="historyView">
    <div class="view-title">Order History</div>
    <div class="view-sub">All billed and paid orders</div>
    <div id="historyContent"><div class="loader">Loading…</div></div>
  </section>

</div>

<!-- ── Receipt Modal ─────────────────────────── -->
<div class="modal-backdrop" id="receiptModal">
  <div class="receipt" id="receiptCard"></div>
</div>

<!-- ── Toast Container ───────────────────────── -->
<div class="toast-container" id="toasts"></div>


<script>
/* ══════════════════════════════════════════════════
   CONFIG
══════════════════════════════════════════════════ */
const API = "/api";

/* ══════════════════════════════════════════════════
   STATE
══════════════════════════════════════════════════ */
let menuData   = [];       // categories + items from API
let cart       = {};       // { item_id: { item, qty } }
let activeView = "pos";
let activeCat  = null;
let searchQ    = "";
let currentPeriod = "today";
let histPage   = 1;

/* ══════════════════════════════════════════════════
   UTILS
══════════════════════════════════════════════════ */
const fmt = v => "₹" + Number(v).toFixed(2);
const fmtDate = s => new Date(s).toLocaleString("en-IN", { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });

async function api(path, opts = {}) {
  try {
    const r = await fetch(API + path, {
      headers: { "Content-Type": "application/json" },
      ...opts,
    });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  } catch (e) {
    toast("error", "Backend unreachable — showing demo mode");
    return null;
  }
}

function toast(type, msg) {
  const el = document.createElement("div");
  el.className = `toast ${type}`;
  el.textContent = msg;
  document.getElementById("toasts").appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

/* ══════════════════════════════════════════════════
   MENU
══════════════════════════════════════════════════ */
async function loadMenu() {
  const data = await api("/menu");
  if (!data) return;
  menuData = data;
  if (menuData.length) activeCat = menuData[0].id;
  renderSidebar();
  renderMenu();
}

function renderSidebar() {
  const sb = document.getElementById("sidebar");
  sb.innerHTML = `<div class="sidebar-label">Categories</div>`;
  menuData.forEach(cat => {
    const btn = document.createElement("button");
    btn.className = "cat-btn" + (cat.id === activeCat ? " active" : "");
    btn.innerHTML = `<span class="icon">${cat.icon}</span>${cat.name}`;
    btn.onclick = () => { activeCat = cat.id; searchQ = ""; document.getElementById("searchBox").value = ""; renderSidebar(); renderMenu(); };
    sb.appendChild(btn);
  });
}

function renderMenu() {
  const el = document.getElementById("menuContent");
  let cats = menuData;
  if (searchQ) {
    const q = searchQ.toLowerCase();
    cats = cats.map(c => ({
      ...c,
      items: c.items.filter(i => i.name.toLowerCase().includes(q) || (i.description||"").toLowerCase().includes(q))
    })).filter(c => c.items.length);
  } else {
    cats = cats.filter(c => c.id === activeCat);
  }

  if (!cats.length) {
    el.innerHTML = `<div class="loader" style="opacity:.5">No items found</div>`;
    return;
  }

  el.innerHTML = cats.map(cat => `
    <div class="cat-title">${cat.icon}  ${cat.name}</div>
    <div class="menu-grid">
      ${cat.items.map(item => `
        <div class="menu-card ${item.available ? "" : "unavailable"}"
             onclick="${item.available ? `addToCart(${item.id})` : ""}">
          <div class="add-dot">＋</div>
          <div class="menu-card-name">${item.name}</div>
          <div class="menu-card-desc">${item.description || ""}</div>
          <div class="menu-card-price">${fmt(item.price)}</div>
        </div>
      `).join("")}
    </div>
    <div style="height:28px"></div>
  `).join("");

  // expose items lookup
  window._itemMap = {};
  menuData.forEach(c => c.items.forEach(i => window._itemMap[i.id] = i));
}

/* ══════════════════════════════════════════════════
   CART
══════════════════════════════════════════════════ */
function addToCart(id) {
  const item = window._itemMap[id];
  if (!item) return;
  if (cart[id]) cart[id].qty++;
  else cart[id] = { item, qty: 1 };
  renderCart();
}

function updateQty(id, delta) {
  if (!cart[id]) return;
  cart[id].qty += delta;
  if (cart[id].qty <= 0) delete cart[id];
  renderCart();
}

function removeFromCart(id) {
  delete cart[id];
  renderCart();
}

function clearCart() {
  cart = {};
  document.getElementById("discountInput").value = "";
  renderCart();
}

function renderCart() {
  const entries = Object.values(cart);
  const countEl = document.getElementById("itemCount");
  const listEl  = document.getElementById("orderItems");
  const total   = entries.reduce((s, e) => s + e.item.price * e.qty, 0);
  const n       = entries.reduce((s, e) => s + e.qty, 0);

  countEl.textContent = `${n} item${n !== 1 ? "s" : ""}`;

  if (!entries.length) {
    listEl.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">☕</div>
        <div class="empty-text">Tap an item to add it</div>
      </div>`;
  } else {
    listEl.innerHTML = entries.map(e => `
      <div class="order-item">
        <div class="oi-name">${e.item.name}</div>
        <div class="oi-price">${fmt(e.item.price * e.qty)}</div>
        <div class="oi-controls">
          <button onclick="updateQty(${e.item.id},-1)">−</button>
          <span class="oi-qty">${e.qty}</span>
          <button onclick="updateQty(${e.item.id},1)">＋</button>
        </div>
        <button class="oi-remove" onclick="removeFromCart(${e.item.id})" title="Remove">✕</button>
      </div>
    `).join("");
  }

  const discount = parseFloat(document.getElementById("discountInput").value) || 0;
  const sub      = total;
  const tax      = sub * 0.05;
  const grand    = Math.max(0, sub + tax - discount);

  document.getElementById("totalsBox").innerHTML = `
    <div class="totals-row"><span>Subtotal</span><span>${fmt(sub)}</span></div>
    <div class="totals-row"><span>GST (5%)</span><span>${fmt(tax)}</span></div>
    ${discount ? `<div class="totals-row"><span>Discount</span><span>− ${fmt(discount)}</span></div>` : ""}
    <div class="totals-row total"><span>Total</span><span>${fmt(grand)}</span></div>
  `;

  const hasItems = entries.length > 0;
  document.getElementById("billBtn").disabled = !hasItems;
  document.getElementById("payBtn").disabled  = !hasItems;
}

/* ══════════════════════════════════════════════════
   PLACE ORDER
══════════════════════════════════════════════════ */
async function placeOrder(status = "open") {
  const entries = Object.values(cart);
  if (!entries.length) return;

  const discount = parseFloat(document.getElementById("discountInput").value) || 0;
  const table    = document.getElementById("tableInput").value.trim() || "T1";

  const payload = {
    table_no: table,
    discount,
    items: entries.map(e => ({
      item_id:    e.item.id,
      quantity:   e.qty,
      unit_price: e.item.price,
    })),
  };

  const order = await api("/orders", {
    method: "POST",
    body:   JSON.stringify(payload),
  });

  if (!order) return;

  // immediately mark billed or paid
  if (status === "billed" || status === "paid") {
    await api(`/orders/${order.id}/status`, {
      method: "PATCH",
      body:   JSON.stringify({ status }),
    });
  }

  toast("success", `Order #${order.id} placed for ${table}`);
  clearCart();

  if (status === "paid") showReceipt(order.id);
}

/* ══════════════════════════════════════════════════
   RECEIPT
══════════════════════════════════════════════════ */
async function showReceipt(orderId) {
  const data = await api(`/orders/${orderId}/receipt`);
  if (!data) return;
  const r = data.receipt;

  document.getElementById("receiptCard").innerHTML = `
    <div class="receipt-header">
      <div class="receipt-cafe">${r.cafe_name}</div>
      <div class="receipt-addr">${r.address}</div>
    </div>
    <div class="receipt-body">
      <div class="receipt-meta">
        Order <b>#${r.order_id}</b> · Table <b>${r.table_no || "—"}</b><br/>
        ${fmtDate(r.created_at)}
      </div>
      <div class="receipt-items">
        ${r.items.map(it => `
          <div class="ri-row">
            <span>${it.name} × ${it.quantity}</span>
            <span>${fmt(it.line_total)}</span>
          </div>
        `).join("")}
        <div class="ri-row divider">
          <span>Subtotal</span><span>${fmt(r.subtotal)}</span>
        </div>
        <div class="ri-row">
          <span>GST (${r.tax_rate})</span><span>${fmt(r.tax)}</span>
        </div>
        ${r.discount ? `<div class="ri-row"><span>Discount</span><span>− ${fmt(r.discount)}</span></div>` : ""}
        <div class="ri-row total-row">
          <span>TOTAL</span><span>${fmt(r.total)}</span>
        </div>
      </div>
      <div class="receipt-thanks">${r.thank_you}</div>
    </div>
    <div class="receipt-actions">
      <button class="btn btn-outline" style="flex:1" onclick="closeReceipt()">Close</button>
      <button class="btn btn-primary" style="flex:1" onclick="window.print()">Print</button>
    </div>
  `;

  document.getElementById("receiptModal").classList.add("open");
}

function closeReceipt() {
  document.getElementById("receiptModal").classList.remove("open");
}

/* ══════════════════════════════════════════════════
   REPORTS
══════════════════════════════════════════════════ */
async function loadReports(period = "today") {
  currentPeriod = period;
  const el = document.getElementById("reportsContent");
  el.innerHTML = `<div class="loader">Loading…</div>`;
  const data = await api(`/reports/sales?period=${period}`);
  if (!data) { el.innerHTML = `<div class="loader">Could not load — is the backend running?</div>`; return; }

  const s = data.summary;
  const maxRev = Math.max(...(data.daily.map(d => d.revenue) || [1]));

  el.innerHTML = `
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Revenue</div>
        <div class="stat-val">${fmt(s.revenue)}</div>
        <div class="stat-sub">${period === "today" ? "today" : `last ${period === "week" ? "7" : "30"} days`}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Orders</div>
        <div class="stat-val">${s.order_count}</div>
        <div class="stat-sub">paid orders</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Avg Order</div>
        <div class="stat-val">${fmt(s.avg_order)}</div>
        <div class="stat-sub">per ticket</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Tax Collected</div>
        <div class="stat-val">${fmt(s.tax_collected)}</div>
        <div class="stat-sub">GST (5%)</div>
      </div>
    </div>
    <div class="report-grid">
      <div class="report-card">
        <div class="report-card-title">🏆  Top Items</div>
        ${data.top_items.length ? data.top_items.map((it, i) => `
          <div class="top-item">
            <div class="top-item-rank">${i+1}</div>
            <div class="top-item-name">${it.name}</div>
            <div class="top-item-qty">${it.qty} sold</div>
            <div class="top-item-rev">${fmt(it.revenue)}</div>
          </div>
        `).join("") : `<div style="font-size:.82rem;color:var(--muted)">No data yet</div>`}
      </div>
      <div class="report-card">
        <div class="report-card-title">📈  Daily Revenue</div>
        <div class="bar-chart">
          ${data.daily.length ? data.daily.slice(-7).map(d => `
            <div class="bar-row">
              <div class="bar-label">${new Date(d.day).toLocaleDateString("en-IN",{month:"short",day:"numeric"})}</div>
              <div class="bar-track"><div class="bar-fill" style="width:${Math.round(d.revenue/maxRev*100)}%"></div></div>
              <div class="bar-val">${fmt(d.revenue)}</div>
            </div>
          `).join("") : `<div style="font-size:.82rem;color:var(--muted)">No data yet</div>`}
        </div>
      </div>
    </div>
  `;
}

/* ══════════════════════════════════════════════════
   HISTORY
══════════════════════════════════════════════════ */
async function loadHistory(page = 1) {
  histPage = page;
  const el = document.getElementById("historyContent");
  el.innerHTML = `<div class="loader">Loading…</div>`;
  const data = await api(`/reports/order-history?page=${page}&per_page=15`);
  if (!data) { el.innerHTML = `<div class="loader">Could not load</div>`; return; }

  const rows = data.orders.map(o => `
    <tr>
      <td><b>#${o.id}</b></td>
      <td>${o.table_no || "—"}</td>
      <td>${fmtDate(o.created_at)}</td>
      <td>${o.item_count} item${o.item_count !== 1 ? "s" : ""}</td>
      <td>${fmt(o.total)}</td>
      <td><span class="status-pill status-${o.status}">${o.status}</span></td>
      <td>
        <button class="btn btn-outline" style="padding:5px 12px;font-size:.75rem"
                onclick="showReceipt(${o.id})">Receipt</button>
      </td>
    </tr>
  `).join("");

  const pages = Array.from({length: data.total_pages}, (_,i) => i+1).map(p => `
    <button class="page-btn ${p===page?"active":""}" onclick="loadHistory(${p})">${p}</button>
  `).join("");

  el.innerHTML = `
    <div style="background:white;border-radius:var(--r);border:1px solid var(--border);overflow:hidden">
      <table class="history-table">
        <thead><tr>
          <th>Order</th><th>Table</th><th>Time</th>
          <th>Items</th><th>Total</th><th>Status</th><th></th>
        </tr></thead>
        <tbody>${rows || `<tr><td colspan="7" style="text-align:center;padding:30px;color:var(--muted)">No orders yet</td></tr>`}</tbody>
      </table>
    </div>
    <div class="pagination">${pages}</div>
  `;
}

/* ══════════════════════════════════════════════════
   VIEW SWITCHING
══════════════════════════════════════════════════ */
function switchView(view) {
  activeView = view;

  const posEls = [document.getElementById("sidebar"), document.getElementById("menuArea")];
  posEls.forEach(el => el.style.display = view === "pos" ? "" : "none");

  document.getElementById("reportsView").classList.toggle("active", view === "reports");
  document.getElementById("historyView").classList.toggle("active", view === "history");

  document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b.dataset.view === view));

  if (view === "reports") loadReports(currentPeriod);
  if (view === "history") loadHistory(1);
}

/* ══════════════════════════════════════════════════
   EVENT WIRING
══════════════════════════════════════════════════ */
document.querySelectorAll(".tab-btn").forEach(btn =>
  btn.addEventListener("click", () => switchView(btn.dataset.view))
);

document.querySelectorAll(".period-btn").forEach(btn =>
  btn.addEventListener("click", () => {
    document.querySelectorAll(".period-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    loadReports(btn.dataset.period);
  })
);

document.getElementById("searchBox").addEventListener("input", e => {
  searchQ = e.target.value.trim();
  renderMenu();
});

document.getElementById("discountInput").addEventListener("input", renderCart);
document.getElementById("clearBtn").addEventListener("click", clearCart);
document.getElementById("billBtn").addEventListener("click", () => placeOrder("billed"));
document.getElementById("payBtn").addEventListener("click",  () => placeOrder("paid"));

document.getElementById("receiptModal").addEventListener("click", function(e) {
  if (e.target === this) closeReceipt();
});

// expose globals needed by inline onclick handlers
window.addToCart       = addToCart;
window.updateQty       = updateQty;
window.removeFromCart  = removeFromCart;
window.showReceipt     = showReceipt;
window.closeReceipt    = closeReceipt;
window.loadHistory     = loadHistory;

/* ══════════════════════════════════════════════════
   INIT
══════════════════════════════════════════════════ */
renderCart();
loadMenu();
</script>
</body>
</html>
